<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111820">
  <title>Bilhetinhos</title>
  <link rel="stylesheet" href="./site-nav.css?v=2">
  <link rel="stylesheet" href="./ceu.css?v=3">
  <link rel="stylesheet" href="./bilhetinhos.css?v=9">
  <script src="./bilhetinhos.js?v=9" defer></script>
</head>
<body class="site-page">
  <div class="sky" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Página inicial"><span aria-hidden="true">☾</span></a>
    <nav class="site-navigation" aria-label="Navegação principal">
      <a href="./index.html">início</a><a href="./nosso-album.html">nosso álbum</a><a href="./poemas.html">poemas</a><a href="./bilhetinhos.html" aria-current="page">bilhetinhos</a>
    </nav>
  </header>
  <main>
    <h1>Um <em>bilhetinho.</em></h1>
    <div class="desk">
      <section class="editor" aria-label="Editar bilhetinho">
        <fieldset>
          <legend>Imagens</legend>
          <input id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
          <button id="add-photos" type="button" aria-describedby="photo-help">Adicionar imagens</button>
          <p id="photo-help">Até 4 imagens em JPG, PNG ou WebP.</p>
          <ul id="photo-list" aria-label="Imagens do bilhetinho"></ul>
          <p id="photo-status" role="status"></p>
        </fieldset>
        <fieldset>
          <legend>Estilo do bilhetinho</legend>
          <div class="styles">
            <label><input type="radio" name="style" value="antigo" checked><canvas width="216" height="149" aria-hidden="true"></canvas><span>Luar antigo</span></label>
            <label><input type="radio" name="style" value="postal"><canvas width="216" height="149" aria-hidden="true"></canvas><span>Correio lunar</span></label>
            <label><input type="radio" name="style" value="caderno"><canvas width="216" height="149" aria-hidden="true"></canvas><span>Caderno de estrelas</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Cor do papel</legend>
          <div class="papers">
            <label><input type="radio" name="paper" value="creme" checked><span class="swatch creme"></span>Creme</label>
            <label><input type="radio" name="paper" value="rosa"><span class="swatch rosa"></span>Rosa</label>
            <label><input type="radio" name="paper" value="azul"><span class="swatch azul"></span>Azul</label>
          </div>
        </fieldset>
        <button id="download" type="button" disabled>Baixar bilhetinho em PNG</button>
        <p id="status" role="status"></p>
        <noscript>Ative o JavaScript para escrever e baixar seu bilhetinho.</noscript>
      </section>
      <figure>
        <figcaption>Sua cartinha</figcaption>
        <p id="text-help">Toque no texto para editar. Arraste as alças da borda para mover, girar ou redimensionar a caixa.</p>
        <div class="text-tools" role="group" aria-label="Caixas de texto">
          <label>Caixa de texto<select id="box-list" aria-label="Selecionar caixa de texto"></select></label>
          <button type="button" id="add-box">Adicionar caixa</button>
        </div>
        <div class="text-tools" role="group" aria-label="Formatação do recado">
          <label>Fonte<select id="text-font">
            <option value="Manuscrita">Manuscrita</option><option value="Carta">Serifada</option>
            <option value="Arial">Sem serifa</option><option value="Courier New">Máquina de escrever</option>
          </select></label>
          <label>Tamanho<select id="text-size">
            <option value="1">32</option><option value="2">44</option><option value="3" selected>56</option>
            <option value="4">68</option><option value="5">80</option><option value="6">96</option><option value="7">112</option>
          </select></label>
          <label>Cor<input id="text-color" type="color" value="#393a35"></label>
          <button type="button" id="text-body">Texto normal</button>
        </div>
        <div class="stage"><div class="card-editor">
          <canvas id="card" width="1080" height="744" aria-hidden="true"></canvas>
          <div id="text-layers"></div>
          <div id="photo-controls"></div>
          <div id="text-frame" role="group" aria-label="Controles da caixa selecionada">
            <div class="box-grips">
              <button type="button" id="move-text" aria-label="Mover caixa de texto" title="Mover caixa">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4m10-8 4 4-4 4"/></svg>
              </button>
              <button type="button" id="rotate-text" aria-label="Girar caixa de texto" title="Arraste para girar ou toque para girar 15°">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 10a7.7 7.7 0 1 0-1 7M19.5 4.5V10H14"/></svg>
              </button>
              <button type="button" id="remove-box" aria-label="Remover caixa de texto" title="Remover caixa" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg>
              </button>
            </div>
            <button type="button" id="resize-text" aria-label="Redimensionar caixa de texto" title="Redimensionar caixa">
              <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M5 12V5h7m0 14h7v-7"/></svg></span>
            </button>
          </div>
        </div></div>
        <small id="count">0 / 280</small>
        <label class="rotation" id="photo-rotation" hidden>Girar foto <input type="range" id="photo-angle" min="-180" max="180" value="0"><output for="photo-angle">0°</output></label>
        <div id="size-panel" hidden>
          <label for="photo-size">Tamanho da foto</label>
          <input id="photo-size" type="range" min="85" max="760">
        </div>
        <p id="gesture-help" hidden>Arraste a foto para movê-la. Para ajustar o tamanho, arraste o botão do canto ou toque nele para abrir a barra de tamanho.</p>
      </figure>
    </div>
  </main>
</body>
</html>
