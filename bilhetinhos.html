<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./site-acesso.css?v=1">
  <script src="./site-acesso.js?v=3"></script>
  <meta name="theme-color" content="#111820">
  <title>Bilhetinhos</title>
  <link rel="stylesheet" href="./site-nav.css?v=4">
  <link rel="stylesheet" href="./ceu.css?v=3">
  <link rel="stylesheet" href="./bilhetinhos.css?v=17">
  <script src="./bilhetinhos-acesso.js?v=5" defer></script>
</head>
<body class="site-page">
  <div class="sky" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Página inicial"><span aria-hidden="true">☾</span></a>
    <nav class="site-navigation" aria-label="Navegação principal">
      <a href="./index.html">início</a><a href="./nosso-album.html"><span class="nav-extra">nosso&nbsp;</span>álbum</a><a href="./poemas.html">poemas</a><a href="./presentes.html">presentes</a><a href="./bilhetinhos.html" aria-current="page">bilhetinhos</a>
    </nav>
  </header>
  <main>
    <p id="notes-loading" role="status">Abrindo os bilhetinhos…</p>
    <template id="notes-template">
    <div class="note-navigation">
      <button id="toggle-notes" type="button">Abrir editor</button>
    </div>
    <section id="collection-view" aria-labelledby="collection-title">
    <h1 id="collection-title" tabindex="-1">Bilhetinhos</h1>
    <section id="daily-note" aria-labelledby="daily-title" hidden>
      <div class="daily-head">
        <button id="older-note" class="date-step" type="button" aria-label="Bilhetinho anterior" title="Anterior"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="daily-date">
          <p id="daily-kicker"></p>
          <h2 id="daily-title"><time id="daily-date"></time></h2>
          <p id="daily-weekday"></p>
        </div>
        <button id="newer-note" class="date-step" type="button" aria-label="Próximo bilhetinho" title="Próximo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="daily-paper">
        <img id="daily-preview" alt="" hidden>
        <p id="daily-wait" hidden></p>
      </div>
      <div class="daily-actions">
        <button id="go-today" type="button" hidden>Voltar para hoje</button>
        <button id="copy-link" type="button">Copiar link deste bilhetinho</button>
        <button id="delete-note" type="button" class="quiet-danger">Excluir</button>
      </div>
    </section>
    <p id="public-status" role="status"></p>
    <section class="note-archive" aria-labelledby="archive-title" hidden>
      <header>
        <h2 id="archive-title">Todos os bilhetinhos</h2>
        <p id="archive-count" role="status"></p>
      </header>
      <div class="archive-filters" role="search">
        <label class="archive-search">Procurar
          <input id="archive-search" type="search" placeholder="Uma palavra ou data" autocomplete="off">
        </label>
        <label>Mês
          <select id="archive-month"></select>
        </label>
        <label>Ir para o dia
          <input id="archive-date" type="date">
        </label>
      </div>
      <div class="archive-chips" role="group" aria-label="Mostrar">
        <button type="button" data-when="all" aria-pressed="true">Todos</button>
        <button type="button" data-when="past" aria-pressed="false">Já abertos</button>
        <button type="button" data-when="future" aria-pressed="false">Agendados</button>
      </div>
      <div id="archive-list"></div>
      <p id="archive-empty" hidden>Nenhum bilhetinho com esse filtro. <button type="button" id="clear-filters">Limpar filtros</button></p>
    </section>
    <section class="note-library" aria-labelledby="library-title">
      <header><h2 id="library-title">Meus bilhetinhos</h2><button id="new-note" type="button">Novo bilhetinho</button></header>
      <p>Rascunhos salvos neste navegador.</p>
      <p id="library-status" role="status"></p>
      <ul id="saved-notes"></ul>
    </section>
    </section>
    <section id="editor-view" aria-labelledby="editor-title" hidden>
    <header class="intro">
      <h1 id="editor-title" tabindex="-1">Um <em>bilhetinho.</em></h1>
      <p id="text-help">Escreva no papel e selecione um trecho para formatar. Arraste ou cole fotos direto no bilhetinho.</p>
    </header>
    <div class="studio">
      <section class="composer-tools" aria-label="Ferramentas da cartinha">
        <div class="tool-head">
          <div class="tool-tabs" role="tablist" aria-label="Ferramentas">
            <button id="tab-text" role="tab" type="button" aria-selected="true" aria-controls="tools-text">Texto</button>
            <button id="tab-paper" role="tab" type="button" aria-selected="false" aria-controls="tools-paper" tabindex="-1">Papel</button>
          </div>
          <div class="insert-tools" role="group" aria-label="Adicionar à cartinha">
            <button type="button" id="add-box"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7V4h14v3M10 4v15m-4 0h8m5-7v8m-4-4h8"/></svg>Adicionar texto</button>
            <button type="button" id="add-photos" aria-describedby="photo-help" title="Até 4 fotos em JPG, PNG ou WebP"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M3 16l5-5 4 4 3-3 5 5m-2-15v7m-3.5-3.5h7"/><circle cx="8" cy="8" r="1"/></svg>Adicionar foto</button>
            <input id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
            <span id="photo-help" class="sr-only">Até 4 fotos em JPG, PNG ou WebP.</span>
          </div>
        </div>
        <p id="photo-status" role="status"></p>
        <div id="tools-text" class="tool-panel text-tools" role="tabpanel" aria-labelledby="tab-text">
          <div class="type-row">
            <div class="field font-field"><label for="text-font">Fonte</label>
              <select id="text-font" aria-describedby="font-status">
                <option value="Manuscrita" style="font-family:Manuscrita">Manuscrita</option>
                <option value="Carta" style="font-family:Carta">Carta</option>
                <option value="Georgia" style="font-family:Georgia">Georgia</option>
                <option value="Times New Roman" style="font-family:'Times New Roman'">Times New Roman</option>
                <option value="Arial" style="font-family:Arial">Arial</option>
                <option value="Verdana" style="font-family:Verdana">Verdana</option>
                <option value="Trebuchet MS" style="font-family:'Trebuchet MS'">Trebuchet MS</option>
                <option value="Courier New" style="font-family:'Courier New'">Courier New</option>
                <option value="" data-custom>Outra fonte…</option>
              </select>
              <input id="custom-font" type="text" placeholder="Nome da fonte e Enter" autocomplete="off" spellcheck="false" maxlength="100" aria-label="Nome de outra fonte" aria-describedby="font-status" hidden>
            </div>
            <div class="field"><label for="text-size">Tamanho</label>
              <div class="size-stepper">
                <button type="button" id="size-down" aria-label="Diminuir fonte">−</button>
                <select id="text-size" aria-label="Tamanho da fonte em pixels">
                  <option value="1">32</option><option value="2">44</option><option value="3" selected>56</option><option value="4">68</option><option value="5">80</option><option value="6">96</option><option value="7">112</option>
                </select>
                <button type="button" id="size-up" aria-label="Aumentar fonte">+</button>
              </div>
            </div>
            <fieldset class="ink-field"><legend>Cor da tinta</legend><div id="ink-colors"></div></fieldset>
          </div>
          <p id="font-status" role="status"></p>
          <div class="box-row">
            <div class="format-group" role="group" aria-label="Estilo do texto">
              <button type="button" class="format" data-command="bold" aria-pressed="false" aria-label="Negrito" title="Negrito (Ctrl+B)"><b>N</b></button>
              <button type="button" class="format" data-command="italic" aria-pressed="false" aria-label="Itálico" title="Itálico (Ctrl+I)"><i>I</i></button>
              <button type="button" class="format" data-command="underline" aria-pressed="false" aria-label="Sublinhado" title="Sublinhado (Ctrl+U)"><u>S</u></button>
            </div>
            <div class="format-group" role="group" aria-label="Alinhamento">
              <button type="button" class="format" data-align="left" aria-pressed="true" aria-label="Alinhar à esquerda" title="Alinhar à esquerda"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
              <button type="button" class="format" data-align="center" aria-pressed="false" aria-label="Centralizar" title="Centralizar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
              <button type="button" class="format" data-align="right" aria-pressed="false" aria-label="Alinhar à direita" title="Alinhar à direita"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
            </div>
            <label for="box-list">Caixa</label><select id="box-list" aria-label="Selecionar caixa de texto"></select>
            <button type="button" id="text-body" title="Volta para a letra manuscrita, sem negrito, itálico ou cor">Limpar formatação</button>
          </div>
        </div>
        <div id="tools-paper" class="tool-panel" role="tabpanel" aria-labelledby="tab-paper" hidden>
        <fieldset>
          <legend>Estilo do bilhetinho</legend>
          <div class="styles">
            <label><input type="radio" name="style" value="antigo" checked><canvas width="216" height="149" aria-hidden="true"></canvas><span>Luar antigo</span></label>
            <label><input type="radio" name="style" value="postal"><canvas width="216" height="149" aria-hidden="true"></canvas><span>Correio lunar</span></label>
            <label><input type="radio" name="style" value="caderno"><canvas width="216" height="149" aria-hidden="true"></canvas><span>Caderno de estrelas</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Cor do papel</legend>
          <div class="papers">
            <label><input type="radio" name="paper" value="creme" checked><span class="swatch creme"></span>Creme</label>
            <label><input type="radio" name="paper" value="rosa"><span class="swatch rosa"></span>Rosa</label>
            <label><input type="radio" name="paper" value="azul"><span class="swatch azul"></span>Azul</label>
          </div>
        </fieldset>
        </div>
      </section>
      <noscript>Ative o JavaScript para escrever e baixar seu bilhetinho.</noscript>
      <figure aria-label="Sua cartinha">
        <div class="stage"><p class="drop-hint" aria-hidden="true">Solte as fotos no papel</p><div class="card-editor">
          <canvas id="card" width="1080" height="744" aria-hidden="true"></canvas>
          <div id="text-layers"></div>
          <div id="photo-controls"></div>
          <div id="text-frame" role="group" aria-label="Controles da caixa selecionada" hidden>
            <div class="box-grips">
              <button type="button" id="move-text" aria-label="Mover caixa de texto" title="Mover caixa">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4m10-8 4 4-4 4"/></svg>
              </button>
              <button type="button" id="rotate-text" aria-label="Girar caixa de texto" title="Arraste para girar ou toque para girar 15°">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 10a7.7 7.7 0 1 0-1 7M19.5 4.5V10H14"/></svg>
              </button>
              <button type="button" id="remove-box" aria-label="Remover caixa de texto" title="Remover caixa" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg>
              </button>
            </div>
            <button type="button" id="resize-text" aria-label="Redimensionar caixa de texto" title="Redimensionar caixa">
              <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M5 12V5h7m0 14h7v-7"/></svg></span>
            </button>
          </div>
        </div></div>
        <div class="paper-actions">
          <button id="save-note" type="button" disabled title="Ctrl+S">Salvar bilhetinho</button>
          <button id="download" type="button" disabled>Baixar bilhetinho em PNG</button>
          <span id="save-state" role="status"></span>
          <small id="count">0 / 280</small>
        </div>
        <div class="pin-actions">
          <label for="pin-date">Data do bilhetinho</label>
          <input id="pin-date" type="date" required>
          <button id="pin-note" type="button" disabled>Publicar bilhetinho</button>
        </div>
        <p id="status" role="status"></p>
        <p id="save-status" role="status"></p>
        <div id="size-panel" hidden>
          <label for="photo-size">Tamanho da foto</label>
          <input id="photo-size" type="range" min="85" max="760">
        </div>
        <p id="gesture-help" hidden>Toque na foto para mostrar as alças. Arraste a seta circular para girar ou o canto para mudar o tamanho.</p>
        <ul id="photo-list" aria-label="Imagens do bilhetinho"></ul>
      </figure>
    </div>
    </section>
  <dialog id="publish-dialog" aria-labelledby="publish-title">
    <form id="publish-form">
      <h2 id="publish-title">Publicar bilhetinho</h2>
      <p id="publish-detail"></p>
      <p id="publish-error" role="status"></p>
      <button type="submit" id="update-publish" hidden>Atualizar o publicado</button>
      <button type="submit" id="confirm-publish">Confirmar publicação</button>
      <button type="button" id="cancel-publish">Cancelar</button>
    </form>
  </dialog>
    </template>
    <div id="notes-app" hidden></div>
  </main>
</body>
</html>
